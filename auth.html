<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Authentification</title>
  
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    body {
      background: linear-gradient(135deg, #1f4037, #99f2c8);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 1rem;
    }
    .auth-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgb(0 0 0 / 0.15);
      max-width: 900px;
      width: 100%;
      display: flex;
      overflow: hidden;
    }
    .form-section {
      padding: 3rem 2rem;
      flex: 1;
    }
    .form-section:not(:last-child) {
      border-right: 1px solid #e0e0e0;
    }
    h2 {
      font-weight: 700;
      margin-bottom: 2rem;
      color: #2c3e50;
    }
    label {
      font-weight: 600;
      color: #34495e;
    }
    input.form-control {
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 1rem;
    }
    button.btn-primary {
      background: #2c3e50;
      border: none;
      padding: 0.75rem 1rem;
      font-weight: 600;
      border-radius: 8px;
      width: 100%;
      transition: background-color 0.3s ease;
    }
    button.btn-primary:hover {
      background: #1a252f;
    }
    .form-text {
      font-size: 0.9rem;
      color: #7f8c8d;
      margin-top: 0.5rem;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .auth-container {
        flex-direction: column;
        max-width: 400px;
      }
      .form-section:not(:last-child) {
        border-right: none;
        border-bottom: 1px solid #e0e0e0;
      }
    }
  </style>
</head>
<body>

  <div class="auth-container shadow">
    <!-- Inscription -->
    <section class="form-section">
      <h2>Créer un compte</h2>
      <form onsubmit="register(event)">
        <div class="mb-3">
          <label for="name" class="form-label">Nom complet</label>
          <input type="text" id="name" class="form-control" placeholder="Votre nom complet" required />
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Adresse email</label>
          <input type="email" id="email" class="form-control" placeholder="exemple@domaine.com" required />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Mot de passe</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required minlength="6" />
          <div class="form-text">Au moins 6 caractères.</div>
        </div>
        <button type="submit" class="btn btn-primary">S'inscrire</button>
      </form>
    </section>

    <!-- Connexion -->
    <section class="form-section bg-light">
      <h2>Se connecter</h2>
      <form id="formConnexion">
        <div class="mb-3">
          <label for="mailConnexion" class="form-label">Adresse email</label>
          <input type="email" id="mailConnexion" class="form-control" placeholder="Votre email" required />
        </div>
        <div class="mb-3">
          <label for="mdpConnexion" class="form-label">Mot de passe</label>
          <input type="password" id="mdpConnexion" class="form-control" placeholder="Votre mot de passe" required />
        </div>
        <button type="submit" class="btn btn-primary">Se connecter</button>
      </form>
    </section>
  </div>

  <!-- Bootstrap Bundle (includes Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Ton script app.js -->
  <script src="assets/js/app.js"></script>
</body>
</html>
